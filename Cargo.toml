[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["The Inklore Authors"]
repository = "https://github.com/MrEthical07/inklore"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[workspace.dependencies]
# internal crates (path dependencies)
inklore-store = { path = "crates/inklore-store" }
inklore-ingest = { path = "crates/inklore-ingest" }
inklore-book = { path = "crates/inklore-book" }
inklore-engine = { path = "crates/inklore-engine" }

# shared external versions
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
anyhow = "1"
wait-timeout = "0.2"
nix = { version = "0.31", default-features = false, features = ["signal"] }
tempfile = "3"
